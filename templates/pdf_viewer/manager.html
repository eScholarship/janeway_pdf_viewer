{% extends "admin/core/base.html" %}
{% load foundation %}

{% block title %}PDF Viewer Manager{% endblock %}

{% block body %}
<div class="box">
    <div class="title-area">
        <h2>PDF Viewer Settings</h2>
    </div>
    <div class="content">
        <form method="POST">
            {% csrf_token %}
            {{ form|foundation }}
            <button type="submit" class="button">Save</button>
        </form>
    </div>
</div>
{% endblock body %}
